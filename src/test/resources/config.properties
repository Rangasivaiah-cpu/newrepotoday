# Browser: chrome | firefox | edge
browser=chrome

# Timeouts (seconds)
implicit.wait=10
page.load.timeout=30
explicit.wait=15

# Base URL for tests - your food order site (foodorder.info uk)
base.url=https://www.foodorder.info

# Screenshot on failure: true | false
screenshot.on.failure=true

# Headless: true | false (chrome/edge only)
headless=false
